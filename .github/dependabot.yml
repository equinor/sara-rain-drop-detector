version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Dependabot applies its native 3-day cooldown without explicit config.
      python-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      # Review major updates together, separately from patch and minor updates.
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
